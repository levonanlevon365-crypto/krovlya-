<style>
/* Раскладка: шапка с загрузкой файла, под ней цифры, замечания и вкладки с таблицами и диаграммой Ганта.

:root{

.g-track{position:relative;height:30px;flex:none;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--dw)*7 - 1px),var(--line) calc(var(--dw)*7 - 1px),var(--line) calc(var(--dw)*7))}

@media (max-width:560px){.field input,.field select,.lag,.warn input[type=number]{font-size:16px}.btn{min-height:44px}.tab{min-height:44px}.g-lab{width:120px}.fig .v{font-size:21px}h1{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:background-color .15s}}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}body{margin:0}</style></head><body><div class="wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== Разбор ТКП и расчёт (без DOM, тестируется в Node) ===== */
function parseTKP(aoa){
  var h=-1,i;
  for(i=0;i<Math.min(aoa.length,40);i++){
    if(aoa[i]&&aoa[i].some(function(c){return typeof c==='string'&&/^Наименование затрат/.test(c.trim());})){h=i;break;}
  }
  if(h<0) throw new Error('Не нашёл колонку «Наименование затрат». Нужен файл ТКП в формате заказчика.');
  var hr=aoa[h];
  function find(re){return hr.findIndex(function(c){return typeof c==='string'&&re.test(c);});}
  var cName=find(/^Наименование затрат/), cCode=find(/Код узла/), cUnit=find(/Ед\.\s*изм/), cQty=find(/Общее кол/), cNum=find(/Номер п\/п/);
  var cP=find(/ПСПР|Предельная/);
  if([cName,cCode,cUnit,cQty,cNum,cP].some(function(x){return x<0;})) throw new Error('В шапке ТКП не хватает колонок (код узла, ед. изм., количество или ПСПР).');
  var cands=[];
  hr.forEach(function(c,ix){
    if(ix>cP&&typeof c==='string'&&c.trim()&&!/Разница/i.test(c)&&!/^\d+$/.test(c.trim())) cands.push({col:ix,name:c.trim()});
  });
  if(!cands.length) throw new Error('Не нашёл колонки с ценами подрядчика.');
  var obj='';
  for(i=0;i<h;i++){ var v=aoa[i]&&aoa[i][0]; if(typeof v==='string'&&/г\.\s*Москва|адрес|Объект/i.test(v)){obj=v.trim();break;} }
  var num=function(v){return typeof v==='number'&&isFinite(v)?v:0;};
  var groups={},works=[],cur=null;
  for(i=h+1;i<aoa.length;i++){
    var r=aoa[i]; if(!r) continue;
    var code=r[cNum];
    if(typeof code!=='string'||!/^\d+(\.\d+)+$/.test(code.trim())) continue;
    code=code.trim();
    var name=r[cName], unit=r[cUnit], qty=r[cQty], icr=r[cCode];
    if(icr&&unit&&typeof qty==='number'){
      var parts=code.split('.'),grp='';
      while(parts.length>1){parts.pop();var g=groups[parts.join('.')];if(g){grp=g;break;}}
      cur={code:code,name:String(name||'').trim(),unit:String(unit).trim(),qty:qty,group:grp||'Прочее',children:[],
           pm:0,ps:0,cm:0,cs:0};
      works.push(cur);
      cur._r=r;
    } else if(!icr&&name&&unit&&typeof qty==='number'){
      if(cur) cur.children.push({name:String(name).trim(),unit:String(unit).trim(),qty:qty,_r:r});
    } else if(name&&!unit){
      groups[code]=String(name).trim();
    }
  }
  return {obj:obj,cands:cands,cols:{p:cP},works:works,_raw:true,_cP:cP};
}
/* цены выбранного подрядчика проставляются отдельно, чтобы можно было переключать */
function applyContractor(model,col){
  var cP=model._cP;
  model.works.forEach(function(w){
    var r=w._r,n=function(v){return typeof v==='number'&&isFinite(v)?v:0;};
    w.pm=n(r[cP]); w.ps=n(r[cP+1]); w.cm=n(r[col]); w.cs=n(r[col+1]);
    w.children.forEach(function(c){c.pm=n(c._r[cP]);c.cm=n(c._r[col]);});
    w.unitMismatch=null;
    w.children.forEach(function(c){
      if(c.unit==='м3'&&w.unit!=='м3'&&Math.abs(c.qty-w.qty)<=1e-6*Math.max(1,w.qty)) w.unitMismatch={child:c.name,unit:w.unit};
    });
  });
  return model;
}
/* превращает модель в то, что можно положить в JSON (без ссылок на строки) */
function plainModel(model){
  return {obj:model.obj,company:model.company,works:model.works.map(function(w){
    return {code:w.code,name:w.name,unit:w.unit,qty:w.qty,group:w.group,pm:w.pm,ps:w.ps,cm:w.cm,cs:w.cs,
      unitMismatch:w.unitMismatch,children:w.children.map(function(c){return {name:c.name,unit:c.unit,qty:c.qty,pm:c.pm,cm:c.cm};})};
  })};
}

function stageRank(n){
  var s=n.toLowerCase();
  if(/фундамент/.test(s)) return 1;
  if(/вертикал/.test(s)){ if(/гидроизол|примыкан/.test(s)) return 8; if(/облицов/.test(s)) return 6; return 5; }
  if(/паро|тепло|огрунт/.test(s)) return 2;
  if(/разуклон/.test(s)) return 3;
  if(/стяжк|галтел/.test(s)) return 4;
  if(/гидроизол/.test(s)) return 7;
  if(/облицов/.test(s)) return 6;
  if(/воронк|прочие|трубопровод|аэратор|водосток|ливн/.test(s)) return 9;
  if(/металл|фартук|молни/.test(s)) return 10;
  if(/покрыт|плитк/.test(s)) return 11;
  return 6.5;
}

/* ---- даты (всё в UTC, чтобы не зависеть от часового пояса) ---- */
function D(y,m,d){return Date.UTC(y,m-1,d);}
var DAY=86400000;
function isHoliday(t){
  var d=new Date(t),m=d.getUTCMonth()+1,dd=d.getUTCDate();
  if(m===1&&dd<=8) return true;
  return (m===2&&dd===23)||(m===3&&dd===8)||(m===5&&(dd===1||dd===9))||(m===6&&dd===12)||(m===11&&dd===4);
}
function isWork(t){var w=new Date(t).getUTCDay();return w!==0&&w!==6&&!isHoliday(t);}
function nextWork(t){while(!isWork(t)) t+=DAY; return t;}
function prevWork(t){while(!isWork(t)) t-=DAY; return t;}
function addWork(t,n){ // n рабочих дней вперёд (или назад)
  var step=n>=0?DAY:-DAY,k=Math.abs(n);
  while(k>0){t+=step; if(isWork(t)) k--;}
  return t;
}
function workBetween(a,b){var c=0,t=a;while(t<=b){if(isWork(t))c++;t+=DAY;}return c;}

function compute(model,P,lags){
  lags=lags||{};
  var rows=model.works.map(function(w){
    var f=(P.fixUnits&&w.unitMismatch)?P.unitK:1;
    var r={w:w,f:f};
    r.pm=w.qty*w.pm*f; r.ps=w.qty*w.ps; r.cm=w.qty*w.cm*f; r.cs=w.qty*w.cs;
    r.total=r.cm+r.cs; r.limit=r.pm+r.ps; r.diff=r.total-r.limit;
    return r;
  });
  var map={},order=[];
  rows.forEach(function(r){
    var g=r.w.group;
    if(!map[g]){map[g]={name:g,mat:0,smr:0,limit:0,rank:stageRank(g),idx:order.length};order.push(g);}
    var s=map[g]; s.mat+=r.cm; s.smr+=r.cs; s.limit+=r.limit;
  });
  var stages=order.map(function(g){return map[g];}).sort(function(a,b){return a.rank-b.rank||a.idx-b.idx;});
  var T={mat:0,smr:0,limit:0};

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
var qf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
var money=function(n){return nf.format(Math.round(n));};
var mln=function(n){return (n/1e6).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' млн ₽';};
var pct=function(x){return (x*100).toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';};
var pad=function(n){return (n<10?'0':'')+n;};
var dt=function(t){var d=new Date(t);return pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+'.'+d.getUTCFullYear();};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var sgn=function(n){return (n>0?'+':n<0?'−':'')+mln(Math.abs(n));};

function nextMonth(){var n=new Date();var y=n.getFullYear(),m=n.getMonth()+1;m++;if(m>12){m=1;y++;}return y+'-'+pad(m)+'-01';}
var DEF={start:nextMonth(),crew:12,rate:6000,labor:50,ovh:10,vat:22,fix:false,k:0.01};
var S={model:null,label:'',P:Object.assign({},DEF),lags:{},tab:'fin',col:null,res:null};

function load(){try{var j=JSON.parse(localStorage.getItem('krovlya.params')||'null');if(j)Object.keys(DEF).forEach(function(k){if(j[k]!==undefined&&j[k]!==null)S.P[k]=j[k];});}catch(e){}}
function save(){try{localStorage.setItem('krovlya.params',JSON.stringify(S.P));}catch(e){}}
function toUI(){var P=S.P;$('p-start').value=P.start;$('p-crew').value=P.crew;$('p-rate').value=P.rate;$('p-labor').value=P.labor;$('p-ovh').value=P.ovh;$('p-vat').value=P.vat;}
function fromUI(){
  var P=S.P,n=function(id,d){var v=parseFloat($(id).value);return isFinite(v)?v:d;};
  var s=$('p-start').value; if(/^\d{4}-\d{2}-\d{2}$/.test(s)) P.start=s;
  P.crew=Math.max(1,n('p-crew',DEF.crew)); P.rate=Math.max(1,n('p-rate',DEF.rate));
  P.labor=Math.min(100,Math.max(0,n('p-labor',DEF.labor))); P.ovh=Math.max(0,n('p-ovh',DEF.ovh)); P.vat=Math.max(0,n('p-vat',DEF.vat));
}
function calcP(){var P=S.P,p=P.start.split('-');
  return {start:Date.UTC(+p[0],+p[1]-1,+p[2]),crew:P.crew,rate:P.rate,labor:P.labor/100,ovh:P.ovh/100,vat:P.vat/100,fixUnits:P.fix,unitK:P.k};}

function msg(t,err){var m=$('msg');m.textContent=t||'';m.className='msg'+(err?' err':'');}

/* ---------- отрисовка ---------- */
function fig(k,v,n,cls){return '<div class="fig"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div><div class="n">'+n+'</div></div>';}
function renderFigs(R){
  var T=R.T,sc=R.sched,pl=R.pl;
  $('figs').innerHTML=
    fig('Итого по ТКП, с НДС',mln(T.total),'материалы '+mln(T.mat)+' · СМР '+mln(T.smr))+
    fig('Относительно ПСПР',sgn(T.diff),'ПСПР '+mln(T.limit)+' · '+(T.limit?(T.diff>0?'+':'')+pct(T.diff/T.limit):'—'),T.diff>0?'over':'good')+
    fig('Срок работ',sc.workDays+' раб. дн.','до '+dt(sc.end)+' · '+sc.weeks+' нед.')+
    fig('Прибыль до налогов',mln(pl.profit),'рентабельность '+pct(pl.margin)+' от выручки без НДС',pl.profit<0?'bad':'');
}
function renderWarns(R){
  var h='';
  if(R.mismatch.length){
    var r=R.mismatch[0],unf=r.cm/r.f;
    var unit=r.w.unit;
    h+='<div class="warn"><strong>Похоже на ошибку единиц в ТКП</strong>'+
      '<p>В позиции «'+esc(r.w.name)+'» материал «'+esc(r.w.unitMismatch.child)+'» посчитан в м³, но его количество ('+qf.format(r.w.qty)+') равно объёму работ в '+esc(unit)+'. Цена за м³ умножена на '+esc(unit)+'. По этой позиции в вашей цене '+money(unf)+' ₽, это '+pct(unf/(R.T.total+unf-r.cm))+' итога.</p>'+
      '<div class="row"><label><input type="checkbox" id="fix" '+(S.P.fix?'checked':'')+'> Считать с исправлением</label>'+
      '<label>м³ на 1 '+esc(unit)+': <input type="number" id="fixk" step="0.001" min="0" value="'+S.P.k+'"></label></div>'+
      '<p style="font-size:12px;color:var(--muted)">0,01 подходит для галтели 100×100 мм. Проверьте сечение по чертежу. Лучше уточнить у заказчика до подачи цены: та же ошибка может быть и в его ПСПР.</p></div>';
  }
  if(R.cust.length){
    var top=R.cust.slice().sort(function(a,b){return b.sum-a.sum;}).slice(0,4).map(function(x){return esc(x.name.split('/')[0].replace(/_$/,'').trim());});
    h+='<div class="warn"><strong>Возможно, материал даёт заказчик</strong>'+
      '<p>В ПСПР у '+R.cust.length+' материалов цена 0 (например: '+top.join(', ')+'), а в вашей цене они учтены на '+mln(R.custSum)+'. Уточните, чьи это материалы, иначе цена выйдет выше предельной.</p></div>';
  }
  $('warns').innerHTML=h;
  var f=$('fix'); if(f) f.onchange=function(){S.P.fix=f.checked;save();render();};
  var k=$('fixk'); if(k) k.onchange=function(){var v=parseFloat(k.value);if(isFinite(v)&&v>=0){S.P.k=v;save();render();}};
}
function viewFin(R){
  var h='<div class="scroll"><table><thead><tr><th class="l">Этап</th><th>Материалы</th><th>СМР</th><th>Итого</th><th>ПСПР</th><th>Откл., ₽</th><th>Откл., %</th></tr></thead><tbody>';
  R.stages.forEach(function(s){
    h+='<tr><td class="name">'+esc(s.name)+'</td><td>'+money(s.mat)+'</td><td>'+money(s.smr)+'</td><td>'+money(s.total)+'</td><td>'+money(s.limit)+'</td><td class="'+(s.diff>0?'over':'')+'">'+money(s.diff)+'</td><td class="'+(s.diff>0?'over':'')+'">'+(s.limit?pct(s.diff/s.limit):'—')+'</td></tr>';
  });
  var T=R.T;
  h+='<tr class="tot"><td>Итого</td><td>'+money(T.mat)+'</td><td>'+money(T.smr)+'</td><td>'+money(T.total)+'</td><td>'+money(T.limit)+'</td><td>'+money(T.diff)+'</td><td>'+(T.limit?pct(T.diff/T.limit):'—')+'</td></tr></tbody></table></div>';
  var pl=R.pl;
  h+='<h2 style="margin-top:18px">Прибыль и рентабельность</h2><div class="scroll"><table style="max-width:560px"><tbody>'+
    [['Выручка по ТКП, с НДС',pl.rev],['НДС',pl.vatSum],['Выручка без НДС',pl.revNet],['Материалы без НДС',pl.matNet],['СМР без НДС',pl.smrNet],['Оплата труда',pl.labor],['Накладные расходы',pl.ovh]]
    .map(function(a){return '<tr><td class="l">'+a[0]+'</td><td>'+money(a[1])+'</td></tr>';}).join('')+
    '<tr class="tot"><td class="l">Прибыль до налогов</td><td>'+money(pl.profit)+'</td></tr><tr class="tot"><td class="l">Рентабельность</td><td>'+pct(pl.margin)+'</td></tr></tbody></table></div>'+
    '<p class="note">Материалы считаются по ценам из ТКП, без наценки. Налог на прибыль или УСН не вычтен.</p>';
  return h;
}
function viewGantt(R){
  var st=R.stages,sc=R.sched;
  var h='<div class="scroll"><table><thead><tr><th class="l">Этап</th><th>Чел.-дн.</th><th>Раб. дн.</th><th>Начало</th><th>Окончание</th><th>Сдвиг, дн.</th></tr></thead><tbody>';
  st.forEach(function(s,i){
    h+='<tr><td class="name">'+(i+1)+'. '+esc(s.name)+'</td><td>'+qf.format(Math.round(s.laborDays*10)/10)+'</td><td>'+s.dur+'</td><td>'+dt(s.start)+'</td><td>'+dt(s.end)+'</td><td><input class="lag" type="number" step="1" data-stage="'+esc(s.name)+'" value="'+(S.lags[s.name]||0)+'" aria-label="Сдвиг этапа '+esc(s.name)+'"></td></tr>';
  });
  h+='<tr class="tot"><td>Весь срок</td><td>'+qf.format(Math.round(sc.laborDays*10)/10)+'</td><td>'+sc.workDays+'</td><td>'+dt(sc.start)+'</td><td>'+dt(sc.end)+'</td><td></td></tr></tbody></table></div>';
  h+='<p class="note">Этапы идут один за другим, одной бригадой. Чтобы этап начался раньше, поставьте отрицательный сдвиг; чтобы позже, положительный (в рабочих днях).</p>';
  /* диаграмма */
  var avail=Math.max(0,($('view').clientWidth||360)-(window.innerWidth<=560?120:170)-4);
  var nd=Math.round((sc.end-sc.start)/DAY)+16, dw=Math.max(window.innerWidth<=560?5:6,Math.min(12,Math.floor(avail/nd))),t0=sc.start-((new Date(sc.start).getUTCDay()+6)%7)*DAY,t1=sc.end+8*DAY,days=Math.round((t1-t0)/DAY),w=days*dw;
  var mons='',d=new Date(t0),y=d.getUTCFullYear(),m=d.getUTCMonth(),names=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  for(;;){var ms=Date.UTC(y,m,1);if(ms>t1)break;var x=Math.max(0,(ms-t0)/DAY*dw);if(ms<t0&&(Date.UTC(y,m+1,1)-t0)/DAY<6){m++;if(m>11){m=0;y++;}continue;}mons+='<div class="g-mon" style="left:'+x+'px">'+names[m]+' '+String(y).slice(2)+'</div>';m++;if(m>11){m=0;y++;}}
  h+='<h2 style="margin-top:18px">Диаграмма Ганта</h2><div class="scroll"><div class="gantt" style="--dw:'+dw+'px;width:max-content;min-width:100%">'+
     '<div class="g-row g-head"><div class="g-lab"></div><div class="g-track" style="width:'+w+'px">'+mons+'</div></div>';
  st.forEach(function(s,i){
    var left=(s.start-t0)/DAY*dw,wd=((s.end-s.start)/DAY+1)*dw;
    h+='<div class="g-row"><div class="g-lab">'+(i+1)+'. '+esc(s.name)+'</div><div class="g-track" style="width:'+w+'px"><div class="g-bar" style="left:'+left+'px;width:'+wd+'px" title="'+dt(s.start)+' – '+dt(s.end)+'">'+(wd>=52?s.dur+' дн.':'')+'</div></div></div>';
  });
  h+='</div></div><p class="note">Вертикальные линии — начало каждой недели.</p>';
  return h;
}
function sortedRows(R){return R.rows.map(function(r,i){return {r:r,i:i,k:stageRank(r.w.group)};}).sort(function(a,b){return a.k-b.k||a.i-b.i;}).map(function(x){return x.r;});}
function viewEst(R){
  var h='<div class="scroll" style="max-height:70vh"><table><thead><tr><th>№</th><th class="l">Наименование работ</th><th>Ед.</th><th>Объём</th><th>Цена мат.</th><th>Цена СМР</th><th>Итого</th><th>ПСПР</th><th>Откл.</th></tr></thead><tbody>';
  var last='',n=0;
  sortedRows(R).forEach(function(r){
    var w=r.w;
    if(w.group!==last){last=w.group;h+='<tr class="tot"><td colspan="9" class="l">'+esc(last)+'</td></tr>';}
    n++;
    h+='<tr class="'+(w.unitMismatch&&!S.P.fix?'flag':'')+'"><td>'+n+'</td><td class="name">'+esc(w.name)+'</td><td>'+esc(w.unit)+'</td><td>'+qf.format(w.qty)+'</td><td>'+qf.format(w.cm*r.f)+'</td><td>'+qf.format(w.cs)+'</td><td>'+money(r.total)+'</td><td>'+money(r.limit)+'</td><td class="'+(r.diff>0?'over':'')+'">'+money(r.diff)+'</td></tr>';
  });
  h+='<tr class="tot"><td></td><td class="l">Итого</td><td></td><td></td><td></td><td></td><td>'+money(R.T.total)+'</td><td>'+money(R.T.limit)+'</td><td>'+money(R.T.diff)+'</td></tr></tbody></table></div><p class="note">Цены с НДС. Итого = объём × (цена материала + цена СМР). Подсвеченная строка — возможная ошибка единиц.</p>';
  return h;
}
function viewMat(R){
  var list=matList(R.rows),sum=0;
  var h='<div class="scroll" style="max-height:70vh"><table><thead><tr><th>№</th><th class="l">Материал</th><th>Ед.</th><th>Количество</th><th>Цена</th><th>Сумма</th></tr></thead><tbody>';
  list.forEach(function(m,i){sum+=m.sum;h+='<tr><td>'+(i+1)+'</td><td class="name">'+esc(m.name)+'</td><td>'+esc(m.unit)+'</td><td>'+qf.format(m.qty)+'</td><td>'+qf.format(m.price)+'</td><td>'+money(m.sum)+'</td></tr>';});
  h+='<tr class="tot"><td></td><td class="l">Итого</td><td></td><td></td><td></td><td>'+money(sum)+'</td></tr></tbody></table></div><p class="note">Для закупки. Сумма может отличаться от сметы на доли процента из-за округлений в ТКП.</p>';
  return h;
}
function render(){
  if(!S.model) return;
  var R=S.res=compute(S.model,calcP(),S.lags);
  $('obj').textContent=S.label;
  renderFigs(R); renderWarns(R);
  var v=$('view');
  v.innerHTML=S.tab==='fin'?viewFin(R):S.tab==='gantt'?viewGantt(R):S.tab==='est'?viewEst(R):viewMat(R);
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===S.tab?'true':'false');});
  Array.prototype.forEach.call(v.querySelectorAll('input.lag'),function(i){i.onchange=function(){var x=parseInt(i.value,10);S.lags[i.getAttribute('data-stage')]=isFinite(x)?x:0;render();};});
}

/* ---------- загрузка файла ---------- */
function setModel(m,label){S.model=m;S.label=label;S.lags={};render();}
function onFile(f){
  msg('Читаю файл…');
  var rd=new FileReader();
  rd.onerror=function(){msg('Не удалось прочитать файл.',true);};
  rd.onload=function(e){
    try{
      if(!window.XLSX) throw new Error('Не загрузилась библиотека чтения Excel. Проверьте интернет и обновите страницу.');
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var name=wb.SheetNames.indexOf('ТКП')>=0?'ТКП':wb.SheetNames[0];
      var aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});
      var m=parseTKP(aoa);
      S.col=m.cands[0].col; m.company=m.cands[0].name; applyContractor(m,S.col);
      var sel=$('p-cand');
      sel.innerHTML=m.cands.map(function(c){return '<option value="'+c.col+'">'+esc(c.name)+'</option>';}).join('');
      $('candBox').hidden=m.cands.length<2;
      sel.onchange=function(){S.col=+sel.value;m.company=sel.options[sel.selectedIndex].text;applyContractor(m,S.col);setModel(m,label(m,f.name));};
      setModel(m,label(m,f.name));
      msg('Загружено: '+m.works.length+' работ из '+f.name+'.');
    }catch(err){msg(err.message||String(err),true);}
  };
  rd.readAsArrayBuffer(f);
}
function label(m,fname){return (m.obj?m.obj.replace(/\s+/g,' ').slice(0,110)+' · ':'')+'цены «'+m.company+'» · '+m.works.length+' работ · '+fname;}

/* ---------- Excel ---------- */
function exportXlsx(){
  var R=S.res; if(!R) return;
  if(!window.XLSX){msg('Библиотека Excel не загрузилась. Обновите страницу.',true);return;}
  var wb=XLSX.utils.book_new(),r0=Math.round;
  var fin=[['Финансовый отчёт по кровельным работам'],[S.label],[],['Этап','Материалы','СМР','Итого','ПСПР','Откл., ₽','Откл., %']];
  R.stages.forEach(function(s){fin.push([s.name,r0(s.mat),r0(s.smr),r0(s.total),r0(s.limit),r0(s.diff),s.limit?+(s.diff/s.limit).toFixed(4):0]);});
  fin.push(['ИТОГО',r0(R.T.mat),r0(R.T.smr),r0(R.T.total),r0(R.T.limit),r0(R.T.diff),R.T.limit?+(R.T.diff/R.T.limit).toFixed(4):0],[],
    ['Прибыль и рентабельность'],['Выручка по ТКП, с НДС',r0(R.pl.rev)],['НДС',r0(R.pl.vatSum)],['Выручка без НДС',r0(R.pl.revNet)],['Материалы без НДС',r0(R.pl.matNet)],['СМР без НДС',r0(R.pl.smrNet)],['Оплата труда',r0(R.pl.labor)],['Накладные',r0(R.pl.ovh)],['Прибыль до налогов',r0(R.pl.profit)],['Рентабельность',+R.pl.margin.toFixed(4)],[],
    ['Допущения: бригада '+S.P.crew+' чел., '+S.P.rate+' руб./день, оплата труда '+S.P.labor+'% СМР, накладные '+S.P.ovh+'%, НДС '+S.P.vat+'%']);
  var w1=XLSX.utils.aoa_to_sheet(fin); w1['!cols']=[{wch:56},{wch:16},{wch:16},{wch:16},{wch:16},{wch:16},{wch:10}]; XLSX.utils.book_append_sheet(wb,w1,'Финотчёт');
  var est=[['№','Этап','Наименование работ','Ед.','Объём','Цена мат.','Цена СМР','Мат.','СМР','Итого','ПСПР','Откл.']],n=0;
  sortedRows(R).forEach(function(r){n++;est.push([n,r.w.group,r.w.name,r.w.unit,r.w.qty,+(r.w.cm*r.f).toFixed(2),r.w.cs,r0(r.cm),r0(r.cs),r0(r.total),r0(r.limit),r0(r.diff)]);});
  est.push(['','','ИТОГО','','','','',r0(R.T.mat),r0(R.T.smr),r0(R.T.total),r0(R.T.limit),r0(R.T.diff)]);
  var w2=XLSX.utils.aoa_to_sheet(est); w2['!cols']=[{wch:5},{wch:34},{wch:60},{wch:7},{wch:10},{wch:11},{wch:11},{wch:13},{wch:13},{wch:14},{wch:14},{wch:13}]; XLSX.utils.book_append_sheet(wb,w2,'Смета');
  var g=[['№','Этап','СМР, руб.','Чел.-дн.','Раб. дн.','Сдвиг','Начало','Окончание']],sc=R.sched;
  var t0=sc.start-((new Date(sc.start).getUTCDay()+6)%7)*DAY,wk=[];
  for(var t=t0;t<=sc.end;t+=7*DAY) wk.push(t);
  wk.forEach(function(t){g[0].push(dt(t).slice(0,5));});
  R.stages.forEach(function(s,i){var row=[i+1,s.name,r0(s.smr),+s.laborDays.toFixed(1),s.dur,S.lags[s.name]||0,dt(s.start),dt(s.end)];wk.forEach(function(t){row.push(s.start<=t+6*DAY&&s.end>=t?'■':'');});g.push(row);});
  g.push(['','Весь срок','',+sc.laborDays.toFixed(1),sc.workDays,'',dt(sc.start),dt(sc.end)]);
  var w3=XLSX.utils.aoa_to_sheet(g); w3['!cols']=[{wch:4},{wch:52},{wch:14},{wch:10},{wch:9},{wch:7},{wch:12},{wch:12}].concat(wk.map(function(){return {wch:5};})); XLSX.utils.book_append_sheet(wb,w3,'График');
  var mt=[['№','Материал','Ед.','Количество','Цена','Сумма']];
  matList(R.rows).forEach(function(m,i){mt.push([i+1,m.name,m.unit,+m.qty.toFixed(3),m.price,r0(m.sum)]);});
  var w4=XLSX.utils.aoa_to_sheet(mt); w4['!cols']=[{wch:5},{wch:80},{wch:7},{wch:12},{wch:12},{wch:14}]; XLSX.utils.book_append_sheet(wb,w4,'Материалы');
  var buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  if(!(window.claude&&window.claude.use)){
    try{
      var bl=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');
      a.href=URL.createObjectURL(bl);a.download='krovlya_smeta_grafik.xlsx';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);msg('Файл скачан.');
    }catch(e){msg('Не удалось скачать файл: '+((e&&e.message)||e),true);}
    return;
  }
  window.claude.use('downloads').then(function(d){
    if(!d){msg('Скачивание недоступно в этом окне.',true);return;}
    return d.save({filename:'Кровля_смета_график.xlsx',data:buf}).then(function(){msg('Файл сохранён.');});
  }).catch(function(e){ if(e&&e.code==='declined') msg('Сохранение отменено.'); else msg('Не удалось сохранить файл: '+((e&&e.message)||e),true); });
}

/* ---------- запуск ---------- */
load(); toUI();
['p-start','p-crew','p-rate','p-labor','p-ovh','p-vat'].forEach(function(id){$(id).addEventListener('change',function(){fromUI();toUI();save();render();});});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;S.tab=b.getAttribute('data-tab');render();});
$('file').addEventListener('change',function(){var f=this.files[0];if(f)onFile(f);this.value='';});
$('dl').addEventListener('click',exportXlsx);
if(window.matchMedia&&window.matchMedia('(max-width:560px)').matches) $('paramBox').open=false;
setModel(SAMPLE,'Пример: '+(SAMPLE.obj?SAMPLE.obj.slice(0,70)+'… · ':'')+'цены «'+SAMPLE.company+'» · '+SAMPLE.works.length+' работ (ваш файл)');
})();

</script>
